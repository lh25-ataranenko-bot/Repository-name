name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autowise
          POSTGRES_PASSWORD: autowise
          POSTGRES_DB: autowise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autowise" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      AUTOWISE_DATABASE_URL: postgresql+psycopg://autowise:autowise@localhost:5432/autowise_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: JavaScript bundle builds
        run: npx expo export --platform android --output-dir /tmp/expo-out
        env:
          EXPO_OFFLINE: "1"

  e2e:
    # The site against a real API and database: pages open and keep their filters.
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autowise
          POSTGRES_PASSWORD: autowise
          POSTGRES_DB: autowise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autowise" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AUTOWISE_DATABASE_URL: postgresql+psycopg://autowise:autowise@localhost:5432/autowise
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start API with the demo catalogue
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed.seed
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and start the site
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
      - name: Install Playwright
        working-directory: web
        run: |
          npm install --no-save playwright@1.63.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: web
        run: node e2e/smoke.cjs http://localhost:3000
      - name: Accessibility audit (WCAG 2.1 AA, light and dark)
        working-directory: web
        run: node e2e/a11y.cjs http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: tail -n 80 api.log web.log
